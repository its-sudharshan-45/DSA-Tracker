<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Practice Tracker</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--row:#161d27;--rowh:#1b2431;--line:#263041;--tx:#e6edf3;--mut:#8b98a9;--acc:#58a6ff;--ok:#3fb950;--okbg:rgba(63,185,80,.1);--e:#3fb950;--m:#e3a008;--h:#f85149;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6fa;--panel:#fff;--row:#fff;--rowh:#f1f5fb;--line:#dde3ec;--tx:#18202b;--mut:#5d6b7e;--acc:#1f6feb;--ok:#1a7f37;--okbg:rgba(26,127,55,.08);--e:#1a7f37;--m:#9a6700;--h:#cf222e;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn.danger:hover{border-color:var(--h);color:var(--h)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;transition:.15s}
.cat:hover{border-color:var(--acc)}
.cat .n{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.cat .bar{height:5px;margin:8px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--mut);transition:.15s}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input[type=search]{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;outline:none}
.tools input:focus,.tools select:focus{border-color:var(--acc)}
.tools select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 12px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--rowh);color:var(--tx);box-shadow:inset 0 -2px var(--acc)}
.hd,.row{display:grid;grid-template-columns:36px 42px 1fr 92px 44px;align-items:center;gap:10px;padding:0 14px}
.hd{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px}
.row{background:var(--row);border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;min-height:52px;margin-bottom:7px;transition:.15s}
.row:hover{background:var(--rowh)}
.row.done{border-left-color:var(--ok);background:var(--okbg)}
.row.done .t{text-decoration:line-through;color:var(--mut)}
.no{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.t{font-weight:500;overflow-wrap:anywhere;padding:10px 0}
.t em{display:block;font-style:normal;font-size:12px;color:var(--mut);font-weight:400}
.pill{justify-self:start;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid currentColor;background:transparent}
.pill.E{color:var(--e)}.pill.M{color:var(--m)}.pill.H{color:var(--h)}
.ck{appearance:none;width:20px;height:20px;border:2px solid var(--mut);border-radius:6px;margin:0;cursor:pointer;display:grid;place-content:center;transition:.15s;background:transparent}
.ck:hover{border-color:var(--ok)}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{color:var(--acc);text-decoration:none;justify-self:end;padding:6px;border-radius:6px;display:grid}
.go:hover{background:var(--rowh)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:340px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog p{margin:0 0 16px}
dialog div{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:720px){
.stats{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}
.hd{display:none}
.row{grid-template-columns:30px 1fr 40px;grid-template-areas:"c t g" "c p g";padding:8px 12px;row-gap:0}
.row .ck{grid-area:c}.row .no{display:none}.row .t{grid-area:t;padding:4px 0 2px}.row .pill{grid-area:p;margin-bottom:6px}.row .go{grid-area:g}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>DSA Practice Tracker<small>68 LeetCode problems · progress saved in this browser</small></h1>
 <div style="display:flex;gap:8px">
  <button class="btn" id="theme" aria-label="Toggle theme">Theme</button>
  <button class="btn danger" id="reset">Reset progress</button>
 </div>
</header>

<section class="stats">
 <div class="stat"><span>Total</span><b id="sT">68</b></div>
 <div class="stat"><span>Completed</span><b id="sC" style="color:var(--ok)">0</b></div>
 <div class="stat"><span>Remaining</span><b id="sR">68</b></div>
 <div class="stat"><span>Completion</span><b id="sP">0%</b></div>
</section>
<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="pf"></i></div>
<div class="cats" id="cats"></div>

<div class="tabs" id="tabs"></div>
<div class="tools">
 <input type="search" id="q" placeholder="Search problems by title…" aria-label="Search problems">
 <div class="seg" id="seg">
  <button data-s="all" class="on">All</button><button data-s="done">Completed</button><button data-s="pending">Pending</button>
 </div>
 <select id="df" aria-label="Difficulty"><option value="">All difficulties</option><option value="E">Easy</option><option value="M">Medium</option><option value="H">Hard</option></select>
 <select id="so" aria-label="Sort"><option value="n">Sort: Original order</option><option value="d">Sort: Difficulty</option><option value="t">Sort: Title A–Z</option><option value="s">Sort: Pending first</option></select>
</div>

<div class="hd"><span></span><span>#</span><span>Problem</span><span>Difficulty</span><span></span></div>
<div id="list"></div>
</div>

<dialog id="dlg">
 <p><b>Reset all progress?</b><br>This will uncheck every problem. This can’t be undone.</p>
 <div><button class="btn" id="no">Cancel</button><button class="btn danger" id="yes">Yes, reset</button></div>
</dialog>

<script>
var KEY="dsa_tracker_progress_v1";
var DATA=[
["Arrays",[["Two Sum","E"],["Contains Duplicate","E"],["Valid Anagram","E"],["Majority Element","E"],["Move Zeroes","E"],["Missing Number","E"],["Best Time to Buy and Sell Stock","E"],["Find All Numbers Disappeared in an Array","E"],["Remove Duplicates from Sorted Array","E"],["Pascal’s Triangle","E"],["Group Anagrams","M"],["Top K Frequent Elements","M"],["Product of Array Except Self","M"],["Longest Consecutive Sequence","M"],["Rotate Array","M"],["Next Permutation","M"],["Sort Colors","M"],["Find the Duplicate Number","M"],["Majority Element II","M"],["Valid Sudoku","M"],["Maximum Subarray","M"],["Maximum Product Subarray","M"],["Find All Duplicates in an Array","M"],["Increasing Triplet Subsequence","M"],["Rearrange Array Elements by Sign","M"],["Longest Mountain in Array","M"],["First Missing Positive","H"],["Count Subarrays With Fixed Bounds","H"],["Minimum Number of Increments on Subarrays to Form a Target Array","H"],["Maximum Sum of 3 Non-Overlapping Subarrays","H"]]],
["Prefix Sums & Difference Arrays",[["Running Sum of 1d Array","E"],["Find Pivot Index","E"],["Range Sum Query - Immutable","E"],["Left and Right Sum Differences","E"],["Subarray Sum Equals K","M"],["Continuous Subarray Sum","M"],["Contiguous Array","M"],["Subarray Sums Divisible by K","M"],["Range Sum Query 2D - Immutable","M"],["Corporate Flight Bookings","M"],["Count of Range Sum","H"],["Max Sum of Rectangle No Larger Than K","H"]]],
["Two Pointers",[["Valid Palindrome","E"],["Two Sum II - Input Array Is Sorted","M"],["Reverse String","E"],["Squares of a Sorted Array","E"],["Merge Sorted Array","E"],["Backspace String Compare","E"],["3Sum","M"],["3Sum Closest","M"],["4Sum","M"],["Container With Most Water","M"],["Remove Duplicates from Sorted Array II","M"],["Boats to Save People","M"],["Valid Triangle Number","M"],["Bag of Tokens","M"],["Number of Subsequences That Satisfy the Given Sum Condition","M"],["Find K Closest Elements","M"],["Max Number of K-Sum Pairs","M"],["Trapping Rain Water","H"],["Minimum Number of Moves to Make Palindrome","H"],["Maximum Number of Visible Points","H"]]],
["Sliding Window",[["Maximum Average Subarray I","E"],["Contains Duplicate II","E"],["Minimum Difference Between Highest and Lowest of K Scores","E"],["Longest Substring Without Repeating Characters","M"],["Longest Repeating Character Replacement","M"],["Permutation in String","M"]]]
];
var DN={E:"Easy",M:"Medium",H:"Hard"},DR={E:0,M:1,H:2};
var P=[],C=DATA.map(function(x){return x[0]}),n=0;
DATA.forEach(function(g){g[1].forEach(function(p){n++;
 P.push({n:n,t:p[0],d:p[1],c:g[0],u:"https://leetcode.com/problems/"+p[0].toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"/"});});});

var done={};
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));
 if(r&&typeof r==="object"&&!Array.isArray(r)){P.forEach(function(p){if(r[p.n]===true)done[p.n]=true;});}}catch(e){done={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}
load();

var cat="All",st="all",$=function(i){return document.getElementById(i)};

function pct(a,b){return b?Math.round(a/b*100):0}
function renderStats(){
 var c=Object.keys(done).length;
 $("sC").textContent=c;$("sR").textContent=P.length-c;$("sP").textContent=pct(c,P.length)+"%";
 $("pf").style.width=pct(c,P.length)+"%";$("pb").setAttribute("aria-valuenow",pct(c,P.length));
 $("cats").innerHTML=C.map(function(k){
  var all=P.filter(function(p){return p.c===k}),d=all.filter(function(p){return done[p.n]}).length;
  return '<button class="cat" data-c="'+k+'"><div class="n"><span>'+k+'</span><span>'+d+'/'+all.length+'</span></div><div class="bar"><i style="width:'+pct(d,all.length)+'%"></i></div></button>';
 }).join("");
}
function renderTabs(){
 $("tabs").innerHTML=["All"].concat(C).map(function(k){return '<button class="tab'+(k===cat?' on':'')+'" data-c="'+k+'">'+k+'</button>'}).join("");
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderList(){
 var q=$("q").value.trim().toLowerCase(),df=$("df").value,so=$("so").value;
 var L=P.filter(function(p){
  return (cat==="All"||p.c===cat)&&(!df||p.d===df)&&(!q||p.t.toLowerCase().indexOf(q)>-1)&&
   (st==="all"||(st==="done")===!!done[p.n]);
 });
 L.sort(function(a,b){
  if(so==="d")return DR[a.d]-DR[b.d]||a.n-b.n;
  if(so==="t")return a.t.localeCompare(b.t);
  if(so==="s")return (!!done[a.n]-!!done[b.n])||a.n-b.n;
  return a.n-b.n;});
 $("list").innerHTML=L.length?L.map(function(p){
  var d=!!done[p.n];
  return '<div class="row'+(d?' done':'')+'" data-n="'+p.n+'">'+
   '<input class="ck" type="checkbox" '+(d?'checked ':'')+'aria-label="Mark '+esc(p.t)+' as completed">'+
   '<span class="no">'+p.n+'</span>'+
   '<div class="t">'+esc(p.t)+(cat==="All"?'<em>'+p.c+'</em>':'')+'</div>'+
   '<span class="pill '+p.d+'">'+DN[p.d]+'</span>'+
   '<a class="go" href="'+p.u+'" target="_blank" rel="noopener noreferrer" title="Open on LeetCode" aria-label="Open '+esc(p.t)+' on LeetCode">'+
   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg></a></div>';
 }).join(""):'<div class="empty">No problems match your filters.</div>';
}
function renderAll(){renderStats();renderTabs();renderList();}

$("list").addEventListener("change",function(e){
 if(!e.target.classList.contains("ck"))return;
 var row=e.target.closest(".row"),id=row.getAttribute("data-n");
 if(e.target.checked)done[id]=true;else delete done[id];
 save();
 if(st!=="all"||$("so").value==="s"){renderAll();}
 else{row.classList.toggle("done",e.target.checked);renderStats();}
});
$("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cat=b.dataset.c;renderTabs();renderList();});
$("cats").addEventListener("click",function(e){var b=e.target.closest(".cat");if(!b)return;cat=b.dataset.c;renderTabs();renderList();});
$("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;st=b.dataset.s;
 Array.prototype.forEach.call($("seg").children,function(x){x.classList.toggle("on",x===b)});renderList();});
["q","df","so"].forEach(function(i){$(i).addEventListener("input",renderList);});
$("reset").onclick=function(){$("dlg").showModal();};
$("no").onclick=function(){$("dlg").close();};
$("yes").onclick=function(){done={};try{localStorage.removeItem(KEY);}catch(e){}$("dlg").close();renderAll();};
$("theme").onclick=function(){var r=document.documentElement;r.setAttribute("data-theme",r.getAttribute("data-theme")==="light"?"dark":"light");};
document.documentElement.setAttribute("data-theme","dark");
renderAll();
</script>
</body>
</html>
